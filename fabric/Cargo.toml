[workspace]
resolver = "2"

[package]
name = "aws0-fabric"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false
description = "A true 1:1 AWS, local-first and horizontally scalable. Built to give you the democracy to run your own cloud."

[[bin]]
name = "aws0"
path = "src/bin/aws0.rs"

[[bin]]
name = "aws0-fabric-witness"
path = "src/bin/witness.rs"

[dependencies]
# Authenticated transport for capacity that spans more than one machine.
# Every message is encrypted and bound to an instance identity.
iroh = "1.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bytes = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = true
codegen-units = 1
