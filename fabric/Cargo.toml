[workspace]
resolver = "2"

[package]
name = "aws0-fabric"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false
description = "Self-hosted, horizontally scalable AWS substrate: iroh QUIC transport, CRDT state, self-healing membership, scheduling, routing, persistence, laboon workloads, and a zero-config smartops facade."

[[bin]]
name = "aws0"
path = "src/bin/aws0.rs"

[[bin]]
name = "aws0-fabric-witness"
path = "src/bin/witness.rs"

[dependencies]
# Verified against the published 1.5.0 source (src/endpoint.rs, src/protocol.rs,
# examples/echo.rs). QUIC + hole punching; every inter-node byte is encrypted and
# authenticated by the endpoint's Ed25519 key, which is also its NodeId.
iroh = "1.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bytes = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = true
codegen-units = 1
